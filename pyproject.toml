# Target ROS environment: humble; Python target is selected by the generator.
# Merge relevant sections into an existing file; preserve package metadata.
[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py310"
extend-exclude = ["build", "install", "log", "output", "docs/_theme"]

# Check errors, naming, statements, and branches for responsibility review.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "N", "PLR0912", "PLR0915"]

[tool.ruff.lint.pylint]
max-statements = 50
max-branches = 12

# Formatting: single quotes, four spaces, and 100 columns.
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
