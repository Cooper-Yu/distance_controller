# Example: pause at B, then resume a separately configurable forward segment to D.
/**:
  ros__parameters:
    manual_mode: true
    route: [AB, BD]
    segment_configuration: independent
    heading_tolerance: 0.01
    segments:
      AB:
        dx: 0.90
        dy: 0.0
        speed: 0.10
        dwell: 1.0
        side_centering: false
      BD:
        dx: 0.20
        dy: 0.0
        speed: 0.05
        dwell: 1.0
        side_centering: false
        completion: position
        max_travel: 0.45
        timeout: 30.0
