# Independent segment definitions; route selects their order.
# Distances and heading tolerance match program defaults; manual mode is explicit.
/**:
  ros__parameters:
    segment_configuration: independent
    route: [AB, BC, CB, BA]
    manual_mode: true
    heading_tolerance: 0.01
    resume_position_tolerance: 0.02
    segments:
      AB:
        dx: 0.90
        dy: 0.0
        speed: 0.10
        dwell: 1.0
        completion: position
        side_centering: false
        timeout: 60.0
        max_travel: 1.15
      BC:
        dx: 0.0
        dy: -0.516780
        speed: 0.10
        dwell: 1.0
        completion: position
        side_centering: false
        timeout: 60.0
        max_travel: 0.77
      CB:
        dx: 0.0
        dy: 0.516780
        speed: 0.10
        dwell: 1.0
        completion: position
        side_centering: false
        timeout: 60.0
        max_travel: 0.77
      BA:
        dx: -0.90
        dy: 0.0
        speed: 0.10
        dwell: 1.0
        completion: position
        side_centering: false
        timeout: 60.0
        max_travel: 1.15
      BD:
        dx: 0.20
        dy: 0.0
        speed: 0.03
        dwell: 1.0
        completion: position
        side_centering: false
        timeout: 30.0
        max_travel: 0.45
